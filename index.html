<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WHO OF US</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #faf8f2;
    }

    .game {
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100%;
      background: #faf8f2;
    }

    /* Фон зберігає пропорції оригінального зображення 928 × 1650 */
    .game-screen {
      position: relative;
      height: 100vh;
      width: calc(100vh * 928 / 1650);
      max-width: 100vw;
      max-height: 100vh;
      aspect-ratio: 928 / 1650;
      background-image: url("bg.png");
      background-size: 100% 100%;
      background-position: center;
      background-repeat: no-repeat;
    }

    /* Невидима зона поверх намальованої кнопки NEXT CARD */
    .next-button {
      position: absolute;
      left: 17%;
      top: 80%;
      width: 69%;
      height: 13%;
      z-index: 2;
      background: transparent;
      border: 0;
      padding: 0;
      margin: 0;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .card-screen {
      position: fixed;
      inset: 0;
      z-index: 10;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.20);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.2s ease, visibility 0.2s ease;
    }

    .card-screen.active {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .card {
      position: relative;
      width: min(68vw, calc(100vh * 928 / 1650 * 0.68));
      aspect-ratio: 744 / 1039;
      max-height: 78vh;
      overflow: hidden;
      background: transparent;
      border-radius: 12px;
      box-shadow: 0 5px 18px rgba(0, 0, 0, 0.16);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      animation: cardAppear 0.22s ease;
    }

    .card img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      user-select: none;
      -webkit-user-drag: none;
    }

    @keyframes cardAppear {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }

    @media (max-width: 600px) {
      .game-screen {
        width: min(100vw, calc(100vh * 928 / 1650));
        height: min(100vh, calc(100vw * 1650 / 928));
      }

      .card {
        width: 68vw;
        max-height: 78vh;
        border-radius: 10px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
      }
    }

    @media (min-width: 601px) and (max-width: 1000px) {
      .card {
        width: 55vw;
        max-height: 78vh;
      }
    }
  </style>
</head>
<body>
  <main class="game">
    <div class="game-screen">
      <button class="next-button" id="nextButton" aria-label="Next card"></button>
    </div>
  </main>

  <div class="card-screen" id="cardScreen" aria-hidden="true">
    <div class="card" id="card">
      <img id="cardImage" src="" alt="WHO OF US card" draggable="false">
    </div>
  </div>

  <script>
    // Усі зображення карток мають назви: с-01.png — с-78.png.
    // Важливо: перша літера в назві — кирилична «с».
    const FIRST_CARD = 1;
    const LAST_CARD = 78;

    const nextButton = document.getElementById("nextButton");
    const cardScreen = document.getElementById("cardScreen");
    const card = document.getElementById("card");
    const cardImage = document.getElementById("cardImage");

    let firstCardShown = false;
    let remainingCards = [];
    let currentCard = null;

    function makeNewRound() {
      remainingCards = [];
      for (let number = 2; number <= LAST_CARD; number++) {
        remainingCards.push(number);
      }

      // Перемішуємо картки, щоб вони випадали випадково без повторів.
      for (let i = remainingCards.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [remainingCards[i], remainingCards[j]] = [remainingCards[j], remainingCards[i]];
      }
    }

    function showCard(number) {
      currentCard = number;
      const formattedNumber = String(number).padStart(2, "0");
      cardImage.src = "с-" + formattedNumber + ".png";
      cardImage.alt = "WHO OF US — card " + formattedNumber;

      card.style.animation = "none";
      void card.offsetWidth;
      card.style.animation = "cardAppear 0.22s ease";

      cardScreen.classList.add("active");
      cardScreen.setAttribute("aria-hidden", "false");
    }

    function showNextCard() {
      if (!firstCardShown) {
        firstCardShown = true;
        showCard(FIRST_CARD);
        return;
      }

      if (remainingCards.length === 0) {
        makeNewRound();
      }

      showCard(remainingCards.pop());
    }

    nextButton.addEventListener("click", showNextCard);

    // Натискання на відкриту картку одразу показує наступну.
    card.addEventListener("click", showNextCard);

    cardImage.addEventListener("dragstart", event => event.preventDefault());

    makeNewRound();
  </script>
</body>
</html>
